<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0812">
<title>The Bread Zaddy</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0a0812; color: #f3e7d3;
    font-family: -apple-system, "Trebuchet MS", system-ui, sans-serif;
    text-align: center;
  }
  .loader { opacity: .85; }
  .loaf { font-size: 56px; animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  .pick { margin-top: 18px; font-size: 14px; }
  .pick a { color: #f0c060; text-decoration: none; margin: 0 10px; border-bottom: 1px dotted #f0c060; }
</style>
</head>
<body>
<div class="loader">
  <div class="loaf">🍞</div>
  <div>Warming the oven…</div>
  <!-- No-JS / fallback: let the player choose. -->
  <noscript>
    <div class="pick">
      <a href="./mobile.html">📱 Phone version</a>
      <a href="./desktop.html">🖥️ Desktop version</a>
    </div>
  </noscript>
</div>
<script>
  (function () {
    // Manual override for testing: ?v=mobile or ?v=desktop
    var forced = new URLSearchParams(location.search).get('v');
    var dest;
    if (forced === 'mobile' || forced === 'desktop') {
      dest = forced;
    } else {
      var ua = navigator.userAgent || '';
      var phoneUA = /Mobi|Android|iPhone|iPod/i.test(ua);
      var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      var narrow = Math.min(window.innerWidth, window.innerHeight) <= 820;
      // Phone = mobile UA, or a coarse-pointer device on a small screen.
      dest = (phoneUA || (coarse && narrow)) ? 'mobile' : 'desktop';
    }
    location.replace(dest === 'mobile' ? './mobile.html' : './desktop.html');
  })();
</script>
</body>
</html>
