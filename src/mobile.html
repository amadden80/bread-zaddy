function createStats(initial = { joy: 72, health: 60, clout: 88 }) {
  const start = { ...initial };
  const values = { ...initial };
  let loaves = 0;
  let baked = 0;
  const subs = [];
  const emit = (k) => {
    for (const cb of subs) cb(k, values[k]);
  };
  return {
    lastActivity: null,   // "cat" | "tennis" | "lift" | "bake" — set by mini-games, read+cleared by the radio
    get: (k) => values[k],
    set(k, v) {
      values[k] = clamp(v, 0, 100);
      emit(k);
    },
    add(k, d) {
      this.set(k, values[k] + d);
    },
    boost(k, frac) {
      const gain = frac * (100 - values[k]);
      this.add(k, gain);
      return gain;
    },
    reset() {
      loaves = 0;
      baked = 0;
      this.lastActivity = null;
      Object.keys(values).forEach((k) => this.set(k, start[k]));
    },
    get loaves() {
      return loaves;
    },
    get baked() {
      return baked;
    },
    get shelfMax() {
      return SHELF_MAX;
    },
    addLoaf() {
      loaves = Math.min(loaves + 1, SHELF_MAX);
      baked++;
    },
    consumeLoaf() {
      if (loaves <= 0) return false;
      loaves--;
      return true;
    },
    onChange(cb) {
      subs.push(cb);
      Object.keys(values).forEach((k) => cb(k, values[k]));
    }
  };
}

    if (router.current === "HOME") {
      home.update(dt);
      home.draw();
    } else {
      router.update(dt);
      router.draw();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
if (document.readyState === "complete" || document.readyState === "interactive") {
  setTimeout(boot, 30);
} else {
  window.addEventListener("DOMContentLoaded", boot);
}</script>
  <style rel="stylesheet" crossorigin>:root {
  --magenta: #ff2d78;

  --dark:    #0a0812;

/* ================================================
   CSS VARIABLES & RESET
   ================================================ */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: var(--dark);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
               Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}

/* ================================================
   GAME ROOT — full-screen container
   ================================================ */
#game-root {
  position: relative;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--dark);
  touch-action: manipulation;
  padding-top:    var(--safe-top);
  padding-bottom: var(--safe-bottom);
  padding-left:   var(--safe-left);
  padding-right:  var(--safe-right);
  display: flex;
  flex-direction: column;
}

/* ================================================
   DEVICE FRAME — on desktop / wide viewports, render the
   game as a centered, portrait iPhone-shaped box. Real
   phones (portrait width ≤ 480px) stay full-bleed.
   Must come AFTER the base #game-root rule so it wins on
   source order (same specificity).
   ================================================ */
@media (min-width: 481px) {
  html, body {
    background: #050409;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #game-root {
    /* iPhone-ish portrait proportions (≈ 9 : 19.5) */
    width: auto;
    height: min(880px, calc(100dvh - 32px));
    aspect-ratio: 9 / 19.5;
    flex: 0 0 auto;
    border-radius: 44px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      0 0 0 10px #1a1a1f,
      0 0 0 11px rgba(255, 255, 255, 0.06),
      0 30px 80px rgba(0, 0, 0, 0.7);
    /* Establish a containing block so position:fixed children
       (e.g. .back-btn) are bound to the frame, not the window. */
    transform: translateZ(0);
  }
}

/* ================================================
   MOCK LABEL
   ================================================ */
#mock-label {
  position: absolute;
  top: calc(var(--safe-top) + 6px);
  right: calc(var(--safe-right) + 10px);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.28);
  pointer-events: none;
  z-index: 300;
  font-weight: 500;
}

/* ================================================
   HUD — stat pills strip at top
   ================================================ */
#hud {
  position: relative;
  z-index: 50;
  display: flex;
  flex-direction: row;
  justify-content: space-evenly;
  align-items: center;
  width: 100%;
  height: var(--hud-height);
  padding: 0 10px;
  gap: 6px;
  background: var(--panel);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  flex-shrink: 0;
}

.stat-pill {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 5px;
  flex: 1;
  min-width: 0;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 20px;
  padding: 6px 8px;
}

.stat-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.55);
  white-space: nowrap;
  flex-shrink: 0;
}

.stat-bar {

  overflow: hidden;

}

.stat-fill {
  height: 100%;

/* Rotate-to-portrait gate (phones held sideways) */

    gap: 16px;

  #rotate-notice .rot-sub { font-weight: 500; font-size: 14px; opacity: 0.65; }
}
@keyframes rotwiggle { 0%,100%{ transform: rotate(-12deg);} 50%{ transform: rotate(78deg);} }

.stat-val {
  font-size: 11px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.85);
  white-space: nowrap;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;

}

/* Narrow screens: when three pills + bars can't fit without the numbers

@media (max-width: 400px) {

}

/* ================================================
   CANVAS WRAP — absolute-fills screen
   ================================================ */
#canvas-wrap {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

#main-canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

/* ================================================
   SPEECH BUBBLE
   ================================================ */
#bubble {
  position: absolute;
  bottom: calc(var(--safe-bottom) + var(--hint-h) + 20px);
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  z-index: 60;
  opacity: 0;

  pointer-events: none;

}

#bubble.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

#bubble-inner {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 10px;
  background: var(--panel);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border: 1px solid rgba(255, 45, 120, 0.35);

}

/* Tail / pointer */
#bubble-inner::after {

  position: absolute;
  bottom: -9px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 9px solid rgba(255, 45, 120, 0.35);
}

#bubble-emoji {
  font-size: 28px;

#bubble-text {

}

/* ================================================

   ================================================ */
#hint {

  z-index: 60;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  color: rgba(255, 255, 255, 0.30);
  text-align: center;
  white-space: nowrap;
  pointer-events: none;
  height: var(--hint-h);
  line-height: var(--hint-h);
}

/* ================================================
   SCREEN OVERLAY — mini-game screens
   ================================================ */
#screen-overlay {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: none;
  background: var(--dark);
}

#screen-overlay.active {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: stretch;
}

/* ================================================
   GAME OVER — full-screen fail state
   ================================================ */
#game-over {
  position: absolute;
  inset: 0;
  z-index: 400;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;

}

#game-over.show {

  animation: slide-up 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
}

#game-over-card {

#gameover-emoji { font-size: 52px; line-height: 1; }

#gameover-title {

#gameover-cause {

#gameover-restart {

/* ================================================

   ================================================ */
.back-btn {
  position: fixed;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;

}

.back-btn:active {
  transform: translateX(-50%) scale(0.96);

/* ================================================
   GAME CANVAS (mini-game screens)
   ================================================ */
.game-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}

/* ================================================
   KEYFRAME ANIMATIONS
   ================================================ */

/* Ripple ring expanding outward from tap point */
@keyframes ripple-out {
  0% {
    transform: scale(0.3);
    opacity: 0.8;
  }
  60% {
    opacity: 0.4;
  }
  100% {
    transform: scale(2.4);
    opacity: 0;
  }
}

/* Float-up: hearts / particles rise and fade */
@keyframes float-up {
  0% {
    transform: translateY(0) scale(1) rotate(0deg);
    opacity: 1;
  }
  40% {
    opacity: 0.9;
  }
  100% {
    transform: translateY(-80px) scale(0.5) rotate(18deg);
    opacity: 0;
  }
}

/* Gentle pulse: scale breathe for attention / idle states */
@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.06);
    opacity: 0.85;
  }
}

  42%       { opacity: 0.88; }
  44%       { opacity: 1; }
  78%       { opacity: 0.94; }
  80%       { opacity: 1; }
}

/* Slide in from bottom (overlay screens) */

  from {
    transform: translateY(30px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* ================================================

/* ================================================

.overlay-header {
